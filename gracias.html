<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="5;url=https://elpocam.github.io/scesa/">
  <title>Mensaje Enviado - SCESA</title>
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: 'Barlow', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .container {
      max-width: 500px;
      padding: 2rem;
    }
    h1 { color: #00c8ff; font-family: 'Bebas Neue', sans-serif; font-size: 3rem; }
    p { font-size: 1.2rem; margin: 1rem 0; }
    .check { font-size: 4rem; }
    .redirect { font-size: 0.9rem; color: #888; margin-top: 2rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="check">✅</div>
    <h1>¡Mensaje Enviado!</h1>
    <p>Gracias por contactarnos.<br>En breve nos pondremos en contacto con usted.</p>
    <p class="redirect">Será redirigido en 5 segundos...</p>
  </div>
</body>
</html>
